
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE YOU - 3D Heart</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030106;
  overflow: hidden;
  font-family: Georgia, serif;
  touch-action: none;
}

canvas {
  display: block;
}

#centerText {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%) scale(.5);
  color: white;
  font-size: clamp(25px, 6vw, 55px);
  letter-spacing: 5px;
  white-space: nowrap;
  text-shadow:
    0 0 10px #ff4a96,
    0 0 30px #ff1680,
    0 0 65px #ff1680;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s, transform 2s;
  z-index: 3;
}

#centerText.show {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

#hint {
  position: fixed;
  bottom: 25px;
  width: 100%;
  text-align: center;
  color: rgba(255,160,200,.55);
  font-size: 11px;
  letter-spacing: 3px;
  pointer-events: none;
}

#loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: #ff6aa7;
  letter-spacing: 4px;
  font-size: 13px;
  background: #030106;
  z-index: 10;
  transition: opacity 1s;
}

</style>
</head>

<body>

<div id="loading">CREATING SOMETHING BEAUTIFUL...</div>
<div id="centerText">LOVE YOU.</div>
<div id="hint">TOUCH & DRAG TO ROTATE</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x030106);
scene.fog = new THREE.FogExp2(0x030106, 0.012);

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0, 55);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;

document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xff8ab9, 1.2));

const pinkLight = new THREE.PointLight(0xff1269, 180, 100);
pinkLight.position.set(-12, 12, 20);
scene.add(pinkLight);

const blueLight = new THREE.PointLight(0x761aff, 100, 100);
blueLight.position.set(15, -10, -15);
scene.add(blueLight);

const whiteLight = new THREE.PointLight(0xffffff, 90, 80);
whiteLight.position.set(0, 5, 20);
scene.add(whiteLight);

// Main heart group
const heartGroup = new THREE.Group();
scene.add(heartGroup);

// Heart equation
function heartPoint(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: 13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t)
  };
}

// Polygon
const polygon = [];

for (let t = 0; t < Math.PI * 2; t += .015) {
  polygon.push(heartPoint(t));
}

function insideHeart(x,y) {
  let inside = false;

  for (
    let i = 0, j = polygon.length - 1;
    i < polygon.length;
    j = i++
  ) {
    const a = polygon[i];
    const b = polygon[j];

    if (
      ((a.y > y) !== (b.y > y)) &&
      (x < (b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)
    ) {
      inside = !inside;
    }
  }

  return inside;
}

// Distance from outline for 3D volume
function surfaceDepth(x,y) {
  let minDistance = Infinity;

  for (let i = 0; i < polygon.length; i += 5) {
    const p = polygon[i];

    const d = Math.hypot(x-p.x,y-p.y);
    minDistance = Math.min(minDistance,d);
  }

  return 4.5 * Math.sqrt(
    Math.max(0, Math.min(1,minDistance/7))
  );
}

// Create heart text
const words = [];

const loader = new FontLoader();

loader.load(
  "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",

  (font) => {

    const geometry = new TextGeometry("I LOVE YOU", {
      font: font,
      size: .53,
      depth: .16,
      curveSegments: 5,
      bevelEnabled: true,
      bevelThickness: .035,
      bevelSize: .025,
      bevelSegments: 3
    });

    geometry.computeBoundingBox();

    const center = new THREE.Vector3();
    geometry.boundingBox.getCenter(center);
    geometry.translate(-center.x,-center.y,-center.z);

    const material = new THREE.MeshPhysicalMaterial({
      color: 0xff5c9e,
      emissive: 0xff145f,
      emissiveIntensity: 1.8,
      metalness: .35,
      roughness: .23,
      clearcoat: 1
    });

    const backMaterial = material.clone();

    const positions = [];
    let attempts = 0;

    while (positions.length < 85 && attempts < 30000) {
      attempts++;

      const x = Math.random()*28-14;
      const y = Math.random()*25-12;

      if (!insideHeart(x,y)) continue;

      // Keep a small center opening
      if (Math.abs(x)<4.3 && Math.abs(y)<2.3) continue;

      if (positions.some(p =>
        Math.hypot(p.x-x,p.y-y)<2.35
      )) continue;

      positions.push({x,y});
    }

    // Reveal from top to bottom
    positions.sort((a,b) => b.y-a.y);

    positions.forEach((p,i) => {

      const z = surfaceDepth(p.x,p.y);

      // Front 3D letters
      const mesh = new THREE.Mesh(
        geometry,
        material.clone()
      );

      mesh.position.set(p.x,p.y,z);
      mesh.rotation.z = (Math.random()-.5)*.16;
      mesh.scale.setScalar(.001);

      mesh.userData = {
        delay: i*.035,
        index: i
      };

      heartGroup.add(mesh);
      words.push(mesh);

      // Back side letters
      const back = new THREE.Mesh(
        geometry,
        backMaterial.clone()
      );

      back.position.set(p.x,p.y,-z);
      back.rotation.y = Math.PI;
      back.rotation.z = mesh.rotation.z;
      back.scale.setScalar(.001);

      back.userData = {
        delay: i*.035,
        index: i
      };

      heartGroup.add(back);
      words.push(back);
    });

    createHeartParticles();

    setTimeout(() => {
      document.getElementById("loading").style.opacity = "0";

      setTimeout(() => {
        document.getElementById("loading").remove();
      },1000);

    },500);
  },

  undefined,

  () => {
    document.getElementById("loading").textContent =
      "FONT FAILED TO LOAD - CHECK INTERNET";
  }
);

// Heart dust
let dust;

function createHeartParticles() {
  const positions = [];

  for(let i=0;i<1800;i++) {
    let x,y;

    do {
      x=Math.random()*32-16;
      y=Math.random()*34-17;
    } while(!insideHeart(x,y));

    const z=surfaceDepth(x,y);

    positions.push(x,y,z+(Math.random()-.5)*.5);
  }

  const geo = new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  const mat = new THREE.PointsMaterial({
    color: 0xff4b96,
    size: .065,
    transparent: true,
    opacity: .65,
    blending: THREE.AdditiveBlending
  });

  dust = new THREE.Points(geo,mat);
  heartGroup.add(dust);
}

// Floating particles
const particleCount = 700;
const particlePositions = new Float32Array(particleCount*3);
const particleSpeeds = [];

for(let i=0;i<particleCount;i++) {
  particlePositions[i*3] = (Math.random()-.5)*75;
  particlePositions[i*3+1] = (Math.random()-.5)*65;
  particlePositions[i*3+2] = (Math.random()-.5)*35;

  particleSpeeds.push(Math.random()*.018+.005);
}

const particleGeo = new THREE.BufferGeometry();

particleGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(particlePositions,3)
);

const particleMat = new THREE.PointsMaterial({
  color: 0xff76b1,
  size: .12,
  transparent: true,
  opacity: .8,
  blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(
  particleGeo,
  particleMat
);

scene.add(particles);

// Orbiting lights
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

for(let i=0;i<35;i++) {
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(.055+Math.random()*.07,8,8),
    new THREE.MeshBasicMaterial({
      color: i%2 ? 0xff3c91 : 0xffb0d1
    })
  );

  const a = i/35*Math.PI*2;

  ball.position.set(
    Math.cos(a)*19,
    Math.sin(a)*14,
    Math.sin(a*3)*4
  );

  orbitGroup.add(ball);
}

// Interaction
let dragging = false;
let lastX = 0;
let lastY = 0;

let targetX = 0;
let targetY = 0;
let autoRotation = true;

renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  autoRotation=false;
});

addEventListener("pointerup",()=>{
  dragging=false;
  autoRotation=true;
});

addEventListener("pointermove",e=>{
  if(!dragging)return;

  targetY += (e.clientX-lastX)*.008;
  targetX += (e.clientY-lastY)*.008;

  targetX=Math.max(-.8,Math.min(.8,targetX));

  lastX=e.clientX;
  lastY=e.clientY;
});

// Animation
const clock = new THREE.Clock();

let elapsed = 0;
let completed = false;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),.04);
  elapsed += dt;

  const beat = 1 + Math.pow(
    Math.max(0,Math.sin(elapsed*3.2)),12
  )*.075;

  // Reveal words progressively
  words.forEach(mesh=>{

    const progress = Math.max(
      0,
      Math.min(1,(elapsed-mesh.userData.delay)/.55)
    );

    const eased = 1-Math.pow(1-progress,3);

    const scale = eased*beat;

    mesh.scale.setScalar(scale);

    if(progress>0 && progress<1) {
      mesh.material.emissiveIntensity =
        2.5 + Math.sin(elapsed*8)*.6;
    }
  });

  if(words.length && elapsed > 4.2 && !completed) {
    completed=true;

    document.getElementById("centerText")
      .classList.add("show");
  }

  // Heart rotation
  if(autoRotation) {
    targetY += dt*.19;
  }

  heartGroup.rotation.y +=
    (targetY-heartGroup.rotation.y)*.035;

  heartGroup.rotation.x +=
    (targetX-heartGroup.rotation.x)*.035;

  heartGroup.scale.setScalar(beat);

  orbitGroup.rotation.y += dt*.12;
  orbitGroup.rotation.x = Math.sin(elapsed*.3)*.15;

  if(dust) {
    dust.material.opacity = .45+
      Math.sin(elapsed*2)*.15;
  }

  // Ambient floating particles
  const arr=particleGeo.attributes.position.array;

  for(let i=0;i<particleCount;i++) {
    arr[i*3+1] += particleSpeeds[i];

    if(arr[i*3+1]>35) {
      arr[i*3+1]=-35;
    }
  }

  particleGeo.attributes.position.needsUpdate=true;

  pinkLight.intensity=160+Math.sin(elapsed*3)*35;

  renderer.render(scene,camera);
}

animate();

// Responsive
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.position.z=innerWidth<600 ? 67 : 55;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

</script>
</body>
</html>
